<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PersonBase</title>
  <style>
    :root {
      --bg: #eef4ff;
      --panel: #ffffff;
      --panel-2: #f6f9ff;
      --line: #dfe7f5;
      --text: #1d2a3a;
      --muted: #5b6d85;
      --primary: #2457d7;
      --primary-strong: #1a46b3;
      --primary-soft: #eaf0ff;
      --danger: #d93d57;
      --danger-soft: #fff1f3;
      --success: #1b8f59;
      --warning: #c57a09;
      --shadow: 0 14px 30px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    body { min-height: 100vh; }
    button, input, textarea, select {
      font: inherit;
    }
    button {
      cursor: pointer;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 12px;
      transition: 0.15s ease;
    }
    button:hover { background: var(--panel-2); }
    button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }
    button.primary:hover { background: var(--primary-strong); }
    button.danger {
      background: var(--danger-soft);
      border-color: rgba(217, 61, 87, 0.25);
      color: var(--danger);
    }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      background: white;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: rgba(36, 87, 215, 0.75);
      box-shadow: 0 0 0 3px rgba(36, 87, 215, 0.12);
    }
    .hidden { display: none !important; }
    .root-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .auth-card {
      width: min(440px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 28px 24px 22px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      font-weight: 800;
      font-size: 28px;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), #5d8cff);
      color: white;
      display: grid;
      place-items: center;
      box-shadow: 0 10px 20px rgba(36, 87, 215, 0.2);
    }
    .tab-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 5px;
      margin-bottom: 18px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .tab-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 9px;
      font-weight: 700;
      padding: 10px 12px;
    }
    .tab-btn.active {
      background: var(--panel);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }
    .field { margin-bottom: 14px; }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .error {
      min-height: 18px;
      color: var(--danger);
      font-size: 12px;
      margin-top: 4px;
      margin-bottom: 10px;
    }
    .auth-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .status {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .status.ok { color: var(--success); }
    .status.error { color: var(--danger); }
    .status.wait { color: var(--warning); }

    .app-shell {
      width: 100%;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      background: var(--bg);
    }
    .sidebar {
      background: #1b2435;
      color: #e1ebfb;
      padding: 18px 12px 12px;
      min-height: 100vh;
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 8px 12px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 800;
      color: #adc2de;
    }
    .db-list { margin-top: 6px; }
    .db-item {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border: 0;
      background: transparent;
      color: inherit;
      border-radius: 12px;
      margin-bottom: 6px;
      text-align: left;
    }
    .db-item.active {
      background: linear-gradient(135deg, var(--primary), #4d7ef7);
      color: white;
      box-shadow: 0 8px 18px rgba(36, 87, 215, 0.22);
    }
    .db-name {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .db-count {
      font-size: 12px;
      opacity: 0.8;
      min-width: 22px;
      text-align: right;
    }

    .main {
      min-width: 0;
      padding: 22px 24px 28px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .topbar .brand {
      margin: 0;
      font-size: 22px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .head h2 {
      margin: 0;
      font-size: 20px;
      flex: 1;
      min-width: 180px;
    }
    .search { width: min(360px, 100%); }
    .table-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: auto;
      min-height: 200px;
    }
    table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }
    th {
      background: var(--panel-2);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 800;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    tbody tr:hover { background: rgba(36, 87, 215, 0.02); }
    tbody tr { cursor: pointer; }
    .cell-name {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .avatar {
      width: 30px;
      height: 30px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 11px;
      font-weight: 800;
    }
    .empty-row {
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
    }
    .empty-row strong {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 18px;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.42);
      display: grid;
      place-items: center;
      padding: 18px;
      z-index: 20;
    }
    .modal {
      width: min(820px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }
    .modal-header, .modal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }
    .modal-footer {
      border-top: 1px solid var(--line);
      border-bottom: 0;
      justify-content: flex-end;
    }
    .modal-body {
      padding: 18px 20px 12px;
    }
    .section {
      margin-top: 16px;
      margin-bottom: 8px;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 800;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .field-full { grid-column: 1 / -1; }
    .tag-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .avatar-box {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: var(--panel-2);
    }
    .avatar-box img {
      width: 86px;
      height: 86px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: white;
    }
    .muted { color: var(--muted); font-size: 12px; }
    .mini-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .family-box, .doc-box, .custom-box {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel-2);
      padding: 12px;
      margin-bottom: 10px;
    }
    .admin-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      max-width: 700px;
      margin: 0 auto;
    }
    .admin-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .admin-row:last-child { border-bottom: 0; }
    .admin-row small {
      display: block;
      color: var(--muted);
      margin-top: 4px;
    }
    @media (max-width: 900px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { min-height: auto; }
      .form-grid, .tag-grid { grid-template-columns: 1fr; }
      .head { align-items: stretch; }
      .search { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    (() => {
      const STORAGE_KEY = 'personbase_store_v1';
      const ADMIN_USER = 'Krew762';
      const ADMIN_PASSWORD = 'A8G95S87';
      const DEFAULT_DB_NAME = 'Основная база';

      const state = {
        store: { users: {}, dbs: [] },
        currentUser: null,
        activeDbId: null,
        search: '',
        mode: 'login',
        statusClass: 'ok',
        statusText: 'Готово'
      };

      function uid() {
        return 'id_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
      }

      function nowTs() {
        return Date.now();
      }

      function escapeHtml(str) {
        return String(str ?? '').replace(/[&<>"']/g, ch => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[ch]));
      }

      function initials(name) {
        const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
        if (!parts.length) return '?';
        const a = parts[0][0] || '';
        const b = parts[1] ? parts[1][0] : '';
        return (a + b).toUpperCase();
      }

      function fmtDate(value) {
        if (!value) return '';
        const d = new Date(value);
        if (Number.isNaN(d.getTime())) return '';
        return d.toLocaleDateString('ru-RU');
      }

      function defaultPerms() {
        return {
          read: true,
          add: true,
          edit: true,
          delRec: true,
          createDb: true,
          renameDb: true,
          delDb: true,
          blocked: false
        };
      }

      function defaultDbPerms() {
        return {
          read: true,
          add: true,
          edit: true,
          delRec: true,
          createDb: true,
          renameDb: true,
          delDb: true
        };
      }

      function ensureUser(username) {
        if (!state.store.users[username]) {
          state.store.users[username] = { hash: '', perms: defaultPerms(), dbPerms: {} };
        }
      }

      function ensureDbAccess(username, dbId) {
        ensureUser(username);
        if (!state.store.users[username].dbPerms[dbId]) {
          state.store.users[username].dbPerms[dbId] = defaultDbPerms();
        }
      }

      function ensureDefaultData() {
        if (!Array.isArray(state.store.dbs) || !state.store.dbs.length) {
          state.store.dbs.push({ id: uid(), name: DEFAULT_DB_NAME, recs: [] });
        }
        for (const name of Object.keys(state.store.users)) {
          for (const db of state.store.dbs) ensureDbAccess(name, db.id);
        }
        if (state.currentUser) {
          ensureDbAccess(state.currentUser, state.activeDbId || state.store.dbs[0].id);
        }
      }

      async function sha256(value) {
        const text = String(value ?? '');
        if (window.crypto && crypto.subtle && window.TextEncoder) {
          const buffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('personbase:' + text));
          return Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }
        let hash = 2166136261 >>> 0;
        for (let i = 0; i < text.length; i++) {
          hash ^= text.charCodeAt(i);
          hash = Math.imul(hash, 16777619);
        }
        return (hash >>> 0).toString(16);
      }

      async function ensureAdminSeed() {
        if (!state.store.users[ADMIN_USER]) {
          state.store.users[ADMIN_USER] = {
            hash: await sha256(ADMIN_PASSWORD),
            perms: defaultPerms(),
            dbPerms: {}
          };
        }
        for (const db of state.store.dbs) ensureDbAccess(ADMIN_USER, db.id);
      }

      function loadLocal() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            state.store = { users: {}, dbs: [] };
            return;
          }
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.dbs)) {
            state.store = parsed;
          }
        } catch (error) {
          console.error('Load local error:', error);
          state.store = { users: {}, dbs: [] };
        }
      }

      function saveLocal() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.store));
      }

      function setStatus(cls, text) {
        state.statusClass = cls;
        state.statusText = text;
        const statusEl = document.getElementById('status');
        if (statusEl) {
          statusEl.className = `status ${cls}`;
          statusEl.textContent = text;
        }
      }

      function isAdmin() {
        return state.currentUser === ADMIN_USER;
      }

      function getUserPerms(username) {
        ensureUser(username);
        return state.store.users[username].perms;
      }

      function getDbPerms(username, dbId) {
        ensureUser(username);
        ensureDbAccess(username, dbId);
        return state.store.users[username].dbPerms[dbId];
      }

      function canGlobal(action) {
        if (!state.currentUser) return false;
        if (isAdmin()) return true;
        return !!(getUserPerms(state.currentUser)[action]);
      }

      function canDb(action, dbId) {
        if (!state.currentUser) return false;
        if (isAdmin()) return true;
        if (!dbId) return true;
        const perms = getDbPerms(state.currentUser, dbId);
        return !!perms[action];
      }

      function currentDb() {
        if (!state.store.dbs.length) {
          state.store.dbs = [{ id: uid(), name: DEFAULT_DB_NAME, recs: [] }];
        }
        if (!state.activeDbId) {
          state.activeDbId = state.store.dbs[0].id;
        }
        return state.store.dbs.find(db => db.id === state.activeDbId) || state.store.dbs[0];
      }

      function renderAuth() {
        const reg = state.mode === 'register';
        document.getElementById('root').innerHTML = `
          <div class="root-wrap">
            <div class="auth-card">
              <div class="brand">
                <div class="brand-mark">▤</div>
                <div>PersonBase</div>
              </div>

              <div class="tab-list">
                <button class="tab-btn ${reg ? '' : 'active'}" data-action="switch-mode" data-mode="login">Вход</button>
                <button class="tab-btn ${reg ? 'active' : ''}" data-action="switch-mode" data-mode="register">Регистрация</button>
              </div>

              <div class="field">
                <label for="login-user">Логин</label>
                <input id="login-user" placeholder="Введите логин" value="${escapeHtml(ADMIN_USER)}" />
              </div>

              <div class="field">
                <label for="login-pass">Пароль</label>
                <input id="login-pass" type="password" placeholder="Введите пароль" />
              </div>

              ${reg ? `
                <div class="field">
                  <label for="login-pass2">Повторите пароль</label>
                  <input id="login-pass2" type="password" placeholder="Повторите пароль" />
                </div>
              ` : ''}

              <div class="error" id="auth-error"></div>
              <button class="primary" data-action="do-auth" style="width:100%;">
                ${reg ? 'Создать аккаунт' : 'Войти'}
              </button>

              <div class="auth-footer">
                <div id="status" class="status ${state.statusClass}">${state.statusText}</div>
                <button data-action="reset-store">Сброс</button>
              </div>
            </div>
          </div>
        `;
      }

      function renderApp() {
        const db = currentDb();
        const dbs = state.store.dbs || [];
        const sidebarHtml = dbs.map(d => {
          const access = canDb('read', d.id);
          return `
            <button class="db-item ${d.id === db.id ? 'active' : ''} ${access ? '' : 'hidden'}" data-action="select-db" data-db-id="${d.id}">
              <span class="db-name">${escapeHtml(d.name)}</span>
              <span class="db-count">${(d.recs || []).length}</span>
            </button>
          `;
        }).join('');

        document.getElementById('root').innerHTML = `
          <div class="app-shell">
            <aside class="sidebar">
              <div class="sidebar-header">
                <span>Базы</span>
                ${canGlobal('createDb') ? '<button data-action="new-db" style="padding:5px 10px;">+</button>' : ''}
              </div>
              <div class="db-list">
                ${sidebarHtml || '<div class="empty-row"><strong>Нет баз</strong>Создайте первую базу.</div>'}
              </div>
            </aside>

            <main class="main">
              <div class="topbar">
                <div class="brand" style="display:flex;align-items:center;gap:12px;">
                  <div class="brand-mark">▤</div>
                  <div>${escapeHtml(db.name)}</div>
                </div>
                <div class="toolbar">
                  <div id="status" class="status ${state.statusClass}">${state.statusText}</div>
                  ${isAdmin() ? '<button data-action="open-admin">Пользователи</button>' : ''}
                  <button data-action="logout">Выход</button>
                </div>
              </div>

              <div class="head">
                <h2>Список людей</h2>
                <input class="search" type="search" id="person-search" placeholder="Поиск по ФИО, телефону, номеру" value="${escapeHtml(state.search)}" />
                <div class="mini-btns">
                  ${canDb('add', db.id) ? '<button class="primary" data-action="new-person">Добавить</button>' : ''}
                  ${canDb('renameDb', db.id) ? '<button data-action="rename-db">Переименовать</button>' : ''}
                  ${canDb('delDb', db.id) ? '<button class="danger" data-action="delete-db">Удалить</button>' : ''}
                </div>
              </div>

              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>ФИО</th>
                      <th>Личный номер</th>
                      <th>Дата рождения</th>
                      <th>Телефон</th>
                      <th>Выплата</th>
                      <th>Статус</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${renderRows(db.recs || [])}
                  </tbody>
                </table>
              </div>
            </main>
          </div>
        `;
      }

      function renderRows(recs) {
        const term = state.search.trim().toLowerCase();
        const rows = (recs || []).filter(rec => {
          if (!term) return true;
          const hay = [
            rec.fio || '',
            rec.personalNumber || '',
            rec.phone || '',
            rec.position || '',
            rec.address || '',
            rec.notes || ''
          ].join(' ').toLowerCase();
          return hay.includes(term);
        });

        if (!rows.length) {
          return `<tr><td colspan="6"><div class="empty-row"><strong>Нет данных</strong>Добавьте первого человека.</div></td></tr>`;
        }

        return rows.map(rec => `
          <tr data-action="open-person" data-person-id="${rec.id}">
            <td>
              <div class="cell-name">
                <span class="avatar">${escapeHtml(initials(rec.fio))}</span>
                ${escapeHtml(rec.fio || '—')}
              </div>
            </td>
            <td>${escapeHtml(rec.personalNumber || '—')}</td>
            <td>${escapeHtml(fmtDate(rec.birth))}</td>
            <td>${escapeHtml(rec.phone || '—')}</td>
            <td>${escapeHtml(rec.paymentStatus || 'Не выплачено')}</td>
            <td>${escapeHtml(rec.exclusionStatus || 'Не исключен')}</td>
          </tr>
        `).join('');
      }

      function openAdminPanel() {
        const users = Object.keys(state.store.users).sort();
        const html = users.map(username => {
          const user = state.store.users[username];
          const perms = user.perms || defaultPerms();
          return `
            <div class="admin-row">
              <div>
                <strong>${escapeHtml(username)}</strong>
                <small>${username === ADMIN_USER ? 'Администратор' : 'Пользователь'}</small>
              </div>
              <label style="display:flex;align-items:center;gap:8px;">
                <input type="checkbox" data-user="${escapeHtml(username)}" data-role="toggle-block" ${perms.blocked ? 'checked' : ''} />
                <span>Блок.</span>
              </label>

      function collectCustomFields() {
        const map = new Map();
        document.querySelectorAll('[data-custom-type]').forEach(el => {
          const idx = el.getAttribute('data-custom-key');
          if (!map.has(idx)) map.set(idx, {});
          const item = map.get(idx);
          item[el.getAttribute('data-custom-type')] = el.value.trim();
        });
        const result = [];
        map.forEach(item => {
          if (item.key || item.value) result.push({ key: item.key || '', value: item.value || '' });
        });
        return result;
      }

      function collectFamilyFields() {
        const map = new Map();
        document.querySelectorAll('[data-family-field]').forEach(el => {
          const idx = el.getAttribute('data-family-index');
          if (!map.has(idx)) map.set(idx, {});
          const item = map.get(idx);
          item[el.getAttribute('data-family-field')] = el.value.trim();
        });
        const result = [];
        map.forEach(item => {
          if (item.name || item.relation || item.phone || item.contact || item.notes) {
            result.push({ name: item.name || '', relation: item.relation || '', phone: item.phone || '', contact: item.contact || '', notes: item.notes || '' });
          }
        });
        return result;
      }

      function savePerson() {
        const db = currentDb();
        const form = document.querySelector('.modal-body');
        if (!form) return;

        const personId = document.querySelector('[data-action="save-person"]')?.getAttribute('data-person-id');
        let rec = (db.recs || []).find(r => r.id === personId);
        if (!rec) {
          rec = { id: uid() };
          db.recs.push(rec);
        }

        const fio = document.getElementById('person-fio')?.value?.trim();
        if (!fio) {
          setStatus('error', 'ФИО обязательно');
          return;
        }

        rec.fio = fio;
        rec.personalNumber = document.getElementById('person-personalNumber')?.value || '';
        rec.birth = document.getElementById('person-birth')?.value || '';
        rec.phone = document.getElementById('person-phone')?.value || '';
        rec.email = document.getElementById('person-email')?.value || '';
        rec.address = document.getElementById('person-address')?.value || '';
        rec.position = document.getElementById('person-position')?.value || '';
        rec.deathDate = document.getElementById('person-deathDate')?.value || '';
        rec.militaryCommissariat = document.getElementById('person-militaryCommissariat')?.value || '';
        rec.relativeContact = document.getElementById('person-relativeContact')?.value || '';
        rec.paymentStatus = document.getElementById('person-paymentStatus')?.value || 'Не выплачено';
        rec.exclusionStatus = document.getElementById('person-exclusionStatus')?.value || 'Не исключен';
        rec.ninetyEightStatus = document.getElementById('person-ninetyEightStatus')?.value || 'Нет';
        rec.familyContact = document.getElementById('person-familyContact')?.value || '';
        rec.notes = document.getElementById('person-notes')?.value || '';
        rec.custom = collectCustomFields();
        rec.family = collectFamilyFields();
        rec.documents = rec.documents || [];
        rec.photo = rec.photo || '';
        rec.upd = nowTs();

        saveLocal();
        closeModal();
        renderApp();
        setStatus('ok', 'Данные сохранены');
      }

      function deletePerson(personId) {
        const db = currentDb();
        db.recs = (db.recs || []).filter(r => r.id !== personId);
        saveLocal();
        closeModal();
        renderApp();
        setStatus('ok', 'Запись удалена');
      }

      function addDb() {
        const name = prompt('Название новой базы:', 'Новая база');
        if (!name || !name.trim()) return;
        const db = { id: uid(), name: name.trim(), recs: [] };
        state.store.dbs.push(db);
        for (const user of Object.keys(state.store.users)) ensureDbAccess(user, db.id);
        state.activeDbId = db.id;
        saveLocal();
        renderApp();
      }

      function renameDb() {
        const db = currentDb();
        const name = prompt('Новое имя базы:', db.name || '');
        if (name === null) return;
        if (!name.trim()) return;
        db.name = name.trim();
        saveLocal();
        renderApp();
      }

      function deleteDb() {
        const db = currentDb();
        if (state.store.dbs.length <= 1) {
          setStatus('error', 'Нельзя удалить последнюю базу');
          return;
        }
        if (!confirm(`Удалить базу "${db.name}"?`)) return;
        state.store.dbs = state.store.dbs.filter(item => item.id !== db.id);
        state.activeDbId = state.store.dbs[0]?.id || null;
        saveLocal();
        renderApp();
      }

      async function doAuth() {
        const username = document.getElementById('login-user')?.value.trim();
        const password = document.getElementById('login-pass')?.value || '';
        const errorEl = document.getElementById('auth-error');
        const reg = state.mode === 'register';

        if (!username || !password) {
          errorEl.textContent = 'Введите логин и пароль';
          return;
        }

        if (reg) {
          const pass2 = document.getElementById('login-pass2')?.value || '';
          if (password !== pass2) {
            errorEl.textContent = 'Пароли не совпадают';
            return;
          }
          if (state.store.users[username]) {
            errorEl.textContent = 'Такой пользователь уже существует';
            return;
          }
          state.store.users[username] = {
            hash: await sha256(password),
            perms: defaultPerms(),
            dbPerms: {}
          };
          for (const db of state.store.dbs) ensureDbAccess(username, db.id);
          state.currentUser = username;
          state.activeDbId = state.store.dbs[0]?.id || null;
          saveLocal();
          renderApp();
          setStatus('ok', 'Регистрация успешна');
          return;
        }

        const user = state.store.users[username];
        if (!user) {
          errorEl.textContent = 'Пользователь не найден';
          return;
        }

        const hash = await sha256(password);
        if (user.hash !== hash) {
          errorEl.textContent = 'Неверный логин или пароль';
          return;
        }

        if (user.perms.blocked) {
          errorEl.textContent = 'Пользователь заблокирован';
          return;
        }

        state.currentUser = username;
        errorEl.textContent = '';
        renderApp();
        setStatus('ok', `Добро пожаловать, ${username}`);
      }

      function logout() {
        state.currentUser = null;
        renderAuth();
        setStatus('ok', 'Вы вышли из системы');
      }

      function resetStore() {
        if (!confirm('Сбросить локальные данные и вернуть форму входа?')) return;
        localStorage.removeItem(STORAGE_KEY);
        state.store = { users: {}, dbs: [] };
        state.currentUser = null;
        state.activeDbId = null;
        state.mode = 'login';
        state.search = '';
        renderAuth();
        setStatus('ok', 'Хранилище сброшено');
      }

      function bindRootEvents() {
        document.addEventListener('click', async (event) => {
          const target = event.target.closest('[data-action]');
          if (!target) return;
          const action = target.dataset.action;

          switch (action) {
            case 'switch-mode':
              state.mode = target.dataset.mode || 'login';
              renderAuth();
              break;
            case 'do-auth':
              await doAuth();
              break;
            case 'reset-store':
              resetStore();
              break;
            case 'logout':
              logout();
              break;
            case 'new-db':
              addDb();
              break;
            case 'select-db':
              state.activeDbId = target.dataset.dbId;
              renderApp();
              break;
            case 'new-person':
              openPersonModal(null);
              break;
            case 'open-person':
              openPersonModal(target.dataset.personId);
              break;
            case 'close-modal':
              closeModal();
              break;
            case 'save-person':
              savePerson();
              break;
            case 'delete-person':
              deletePerson(target.dataset.personId);
              break;
            case 'rename-db':
              renameDb();
              break;
            case 'delete-db':
              deleteDb();
              break;
            case 'open-admin':
              openAdminPanel();
              break;
            case 'delete-user':
              {
                const user = target.dataset.user;
                if (user === ADMIN_USER) {
                  setStatus('error', 'Нельзя удалить администратора');
                  return;
                }
                if (confirm(`Удалить пользователя ${user}?`)) {
                  delete state.store.users[user];
                  saveLocal();
                  closeModal();
                  renderApp();
                }
              }
              break;
            case 'add-family-row':
              addFamilyRow();
              break;
            case 'remove-family':
              {
                const idx = Number(target.dataset.index);
                const box = document.querySelector('[data-family-index="' + idx + '"]')?.closest('.family-box');
                if (box) box.remove();
              }
              break;
            case 'add-custom-row':
              addCustomRow();
              break;
            case 'remove-custom':
              {
                const idx = Number(target.dataset.index);
                const box = document.querySelector('[data-custom-key="' + idx + '"]')?.closest('.custom-box');
                if (box) box.remove();
              }
              break;
            case 'remove-photo':
              {
                const db = currentDb();
                const personId = document.querySelector('[data-action="save-person"]')?.getAttribute('data-person-id');
                const rec = (db.recs || []).find(r => r.id === personId);
                if (rec) rec.photo = '';
                closeModal();
                openPersonModal(personId || rec?.id);
              }
              break;
            case 'remove-document':
              {
                const docId = target.dataset.docId;
                const db = currentDb();
                const personId = document.querySelector('[data-action="save-person"]')?.getAttribute('data-person-id');
                const rec = (db.recs || []).find(r => r.id === personId);
                if (rec) rec.documents = (rec.documents || []).filter(doc => String(doc.id || '') !== String(docId));
                saveLocal();
                closeModal();
                openPersonModal(personId);
              }
              break;
            default:
              break;
          }
        });

        document.addEventListener('input', (event) => {
          const searchInput = event.target.closest('#person-search');
          if (searchInput) {
            state.search = searchInput.value;
            const db = currentDb();
            const tableBody = document.querySelector('tbody');
            if (tableBody) tableBody.innerHTML = renderRows(db.recs || []);
          }
        });

        document.addEventListener('change', (event) => {
          const userCheckbox = event.target.closest('[data-role="toggle-block"]');
          if (!userCheckbox) return;
          const user = userCheckbox.dataset.user;
          if (!user || !state.store.users[user]) return;
          state.store.users[user].perms = state.store.users[user].perms || defaultPerms();
          state.store.users[user].perms.blocked = !!userCheckbox.checked;
          saveLocal();
        });

        document.addEventListener('change', (event) => {
          const imgInput = event.target.closest('[data-role="photo-upload"]');
          if (!imgInput || !imgInput.files || !imgInput.files[0]) return;
          const file = imgInput.files[0];
          const reader = new FileReader();
          reader.onload = () => {
            const db = currentDb();
            const personId = document.querySelector('[data-action="save-person"]')?.getAttribute('data-person-id');
            let rec = personId ? (db.recs || []).find(r => r.id === personId) : null;
            if (!rec) {
              rec = { id: uid() };
              db.recs.push(rec);
            }
            rec.photo = reader.result;
            saveLocal();
            closeModal();
            openPersonModal(personId || rec.id);
          };
          reader.readAsDataURL(file);
        });

        document.addEventListener('change', (event) => {
          const pdfInput = event.target.closest('[data-role="pdf-upload"]');
          if (!pdfInput || !pdfInput.files) return;
          const files = Array.from(pdfInput.files);
          if (!files.length) return;
          const db = currentDb();
          const personId = document.querySelector('[data-action="save-person"]')?.getAttribute('data-person-id');
          let rec = personId ? (db.recs || []).find(r => r.id === personId) : null;
          if (!rec) {
            rec = { id: uid() };
            db.recs.push(rec);
          }
          rec.documents = rec.documents || [];
          files.forEach(file => {
            const reader = new FileReader();
            reader.onload = () => {
              rec.documents.push({
                id: uid(),
                name: file.name,
                size: `${Math.round(file.size / 1024)} KB`,
                dataUrl: reader.result
              });
              saveLocal();
              closeModal();
              openPersonModal(personId || rec.id);
            };
            reader.readAsDataURL(file);
          });
        });
      }

      async function init() {
        loadLocal();
        ensureDefaultData();
        await ensureAdminSeed();
        saveLocal();
        bindRootEvents();
        renderAuth();
      }

      init();
    })();
  </script>
</body>
