<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PersonBase</title>
  <style>
    :root {
      --bg: #f5f7ff;
      --bg-strong: #edf2ff;
      --panel: rgba(255, 255, 255, 0.82);
      --panel-solid: #ffffff;
      --panel-soft: #f6f9ff;
      --line: rgba(148, 163, 184, 0.28);
      --line-strong: rgba(96, 165, 250, 0.32);
      --text: #0f172a;
      --muted: #5b6b82;
      --primary: #2563eb;
      --primary-2: #1d4ed8;
      --success: #1f9d6a;
      --danger: #e11d48;
      --warning: #d97706;
      --shadow: 0 16px 36px rgba(15, 23, 42, 0.08), 0 2px 10px rgba(15, 23, 42, 0.05);
      --sidebar-start: #0f172a;
      --sidebar-end: #1e293b;
      --glass: rgba(255,255,255,0.7);
      --chip: rgba(37,99,235,0.08);
      --shadow-strong: 0 20px 50px rgba(15, 23, 42, 0.18);
      --font: "SF Pro Display", "SF Pro Text", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body[data-theme="dark"] {
      --bg: #0b1120;
      --bg-strong: #0f172a;
      --panel: rgba(15, 23, 42, 0.72);
      --panel-solid: #111827;
      --panel-soft: #121d2f;
      --line: rgba(148, 163, 184, 0.18);
      --line-strong: rgba(96, 165, 250, 0.36);
      --text: #e5eefc;
      --muted: #a7b4c8;
      --primary: #60a5fa;
      --primary-2: #3b82f6;
      --success: #34d399;
      --danger: #f87171;
      --warning: #fbbf24;
      --shadow: 0 18px 36px rgba(2, 6, 23, 0.42), 0 6px 18px rgba(15, 23, 42, 0.35);
      --sidebar-start: #020817;
      --sidebar-end: #0f172a;
      --glass: rgba(15, 23, 42, 0.62);
      --chip: rgba(96,165,250,0.12);
      --shadow-strong: 0 20px 60px rgba(2,6,23,0.6);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: var(--font);
      background:
        radial-gradient(circle at top left, rgba(96,165,250,0.12), transparent 30%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-strong) 100%);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      min-height: 100vh;
      transition: background 0.2s ease, color 0.2s ease;
    }
    button, input, textarea, select {
      font: inherit;
    }
    button {
      cursor: pointer;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 12px;
      padding: 9px 14px;
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      box-shadow: 0 1px 0 rgba(255,255,255,0.15) inset;
    }
    button:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,0.12);
      border-color: var(--line-strong);
    }
    button.primary {
      background: linear-gradient(135deg, var(--primary), #4f8bff);
      border-color: rgba(37,99,235,0.5);
      color: white;
      box-shadow: 0 10px 18px rgba(37, 99, 235, 0.18);
    }
    button.primary:hover {
      filter: brightness(1.04);
      box-shadow: 0 14px 24px rgba(37, 99, 235, 0.24);
    }
    button.danger {
      background: rgba(225, 29, 72, 0.08);
      color: var(--danger);
      border-color: rgba(225, 29, 72, 0.18);
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.24);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 12px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    body[data-theme="dark"] input,
    body[data-theme="dark"] textarea,
    body[data-theme="dark"] select {
      background: rgba(15, 23, 42, 0.85);
    }
    input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.8; }
    input:focus, textarea:focus, select:focus {
      border-color: rgba(59, 130, 246, 0.7);
      box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.14);
      background: rgba(255,255,255,0.7);
    }
    body[data-theme="dark"] input:focus,
    body[data-theme="dark"] textarea:focus,
    body[data-theme="dark"] select:focus {
      background: rgba(15, 23, 42, 0.95);
    }
    a {
      color: var(--primary);
      text-decoration: none;
    }
    .hidden { display: none !important; }

    #root {
      min-height: 100vh;
    }

    .root-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .auth-card {
      width: min(440px, 100%);
      background: var(--glass);
      backdrop-filter: blur(18px);
      border: 1px solid var(--line);
      border-radius: 30px;
      box-shadow: var(--shadow-strong);
      padding: 28px 24px 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      font-weight: 800;
      font-size: 28px;
      letter-spacing: -0.04em;
    }
    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), #7aa6ff);
      color: white;
      display: grid;
      place-items: center;
      font-size: 20px;
      box-shadow: 0 10px 18px rgba(37, 99, 235, 0.2);
    }

    .tab-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel-soft);
      margin-bottom: 20px;
    }
    .tab-btn {
      background: transparent;
      border: 0;
      border-radius: 10px;
      color: var(--muted);
      font-weight: 700;
      padding: 10px 12px;
    }
    .tab-btn.active {
      background: var(--panel-solid);
      color: var(--text);
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
    }

    .field { margin-bottom: 14px; }
    label {
      display: block;
      margin-bottom: 7px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }
    .error {
      min-height: 22px;
      color: var(--danger);
      font-size: 12px;
      margin: 4px 0 10px;
    }
    .auth-footer {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .status {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .status.ok { color: var(--success); }
    .status.error { color: var(--danger); }
    .status.wait { color: var(--warning); }

    .app-shell {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: 100vh;
      background: transparent;
    }

    .sidebar {
      background: linear-gradient(180deg, var(--sidebar-start), var(--sidebar-end));
      color: #edf4ff;
      padding: 18px 12px 14px;
      min-height: 100vh;
      border-right: 1px solid rgba(255,255,255,0.06);
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px 14px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(191, 219, 254, 0.85);
    }
    .db-list { margin-top: 8px; }
    .db-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border: 0;
      background: transparent;
      color: inherit;
      border-radius: 14px;
      margin-bottom: 6px;
      text-align: left;
      transition: background 0.18s ease, transform 0.18s ease;
    }
    .db-item:hover {
      background: rgba(255,255,255,0.04);
      transform: translateX(1px);
    }
    .db-item.active {
      background: linear-gradient(135deg, var(--primary), #60a5fa);
      color: white;
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.24);
    }
    .db-name {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .db-count {
      min-width: 22px;
      text-align: right;
      opacity: 0.8;
      font-size: 12px;
    }

    .main {
      min-width: 0;
      padding: 24px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      padding: 6px 0;
    }
    .topbar .brand {
      margin: 0;
      font-size: 22px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .theme-toggle {
      border: 1px solid var(--line);
      background: var(--chip);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 10px;
    }
    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      padding: 2px 2px 8px;
    }
    .head h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      flex: 1;
      min-width: 180px;
      letter-spacing: -0.04em;
    }
    .search {
      width: min(370px, 100%);
      background: var(--panel);
    }
    .mini-btns {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .table-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: auto;
      min-height: 200px;
      backdrop-filter: blur(16px);
    }
    table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
    }
    th, td {
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }
    th {
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    tbody tr {
      cursor: pointer;
      transition: background 0.15s ease;
    }
    tbody tr:hover { background: rgba(96,165,250,0.04); }
    .cell-name {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
      color: var(--primary);
      background: rgba(96,165,250,0.15);
      border: 1px solid rgba(96,165,250,0.15);
    }
    .empty-row {
      text-align: center;
      color: var(--muted);
      padding: 34px 20px;
    }
    .empty-row strong {
      display: block;
      margin-bottom: 8px;
      font-size: 18px;
      color: var(--text);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(15, 23, 42, 0.46);
      z-index: 50;
      backdrop-filter: blur(12px);
    }
    .modal {
      width: min(820px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: var(--panel-solid);
      border: 1px solid var(--line);
      border-radius: 26px;
      box-shadow: var(--shadow-strong);
    }
    .modal-header, .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }
    .modal-footer {
      border-top: 1px solid var(--line);
      border-bottom: 0;
      justify-content: flex-end;
    }
    .modal-body {
      padding: 18px 20px 12px;
    }
    .section {
      margin-top: 18px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .form-grid, .tag-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .field-full { grid-column: 1 / -1; }
    .avatar-box {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel-soft);
      padding: 12px;
      margin-bottom: 16px;
    }
    .avatar-box img {
      width: 86px;
      height: 86px;
      object-fit: cover;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #fff;
    }
    .muted { color: var(--muted); font-size: 12px; }
    .family-box, .doc-box, .custom-box {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel-soft);
      padding: 12px;
      margin-bottom: 10px;
    }
    .admin-panel {
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      max-width: 700px;
      margin: 0 auto;
    }
    .admin-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .admin-row:last-child { border-bottom: 0; }
    .admin-row small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { min-height: auto; }
      .head { align-items: stretch; }
      .search { width: 100%; }
      .form-grid, .tag-grid { grid-template-columns: 1fr; }
      .main { padding: 16px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    (() => {
      const STORAGE_KEY = 'personbase_store_v2';
      const ADMIN_USER = 'Krew762';
      const ADMIN_PASSWORD = 'A8G95S87';
      const DEFAULT_DB_NAME = 'Основная база';

      const state = {
        store: { users: {}, dbs: [] },
        currentUser: null,
        activeDbId: null,
        search: '',
        mode: 'login',
        theme: 'light',
        statusClass: 'ok',
        statusText: 'Готово'
      };

      function uid() {
        return 'id_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
      }

      function escapeHtml(str) {
        return String(str ?? '').replace(/[&<>"']/g, (ch) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[ch]));
      }

      function initials(name) {
        const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
        if (!parts.length) return '?';
        const a = parts[0][0] || '';
        const b = parts[1] ? parts[1][0] : '';
        return (a + b).toUpperCase();
      }

      function fmtDate(value) {
        if (!value) return '';
        const d = new Date(value);
        if (Number.isNaN(d.getTime())) return '';
        return d.toLocaleDateString('ru-RU');
      }

      function defaultPerms() {
        return { read: true, add: true, edit: true, delRec: true, createDb: false, renameDb: false, delDb: false, blocked: false };
      }

      function defaultDbPerms() {
        return { read: true, add: true, edit: true, delRec: true, renameDb: false, delDb: false };
      }

      function ensureUser(username) {
        if (!state.store.users[username]) {
          state.store.users[username] = { hash: '', perms: defaultPerms(), dbPerms: {} };
        }
      }

      function ensureDbAccess(username, dbId) {
        ensureUser(username);
        if (!state.store.users[username].dbPerms[dbId]) {
          state.store.users[username].dbPerms[dbId] = defaultDbPerms();
        }
      }

      function ensureDefaultData() {
        if (!Array.isArray(state.store.dbs) || !state.store.dbs.length) {
          state.store.dbs.push({ id: uid(), name: DEFAULT_DB_NAME, recs: [] });
        }
        for (const user of Object.keys(state.store.users)) {
          for (const db of state.store.dbs) ensureDbAccess(user, db.id);
        }
        if (state.currentUser) {
          ensureDbAccess(state.currentUser, state.activeDbId || state.store.dbs[0].id);
        }
      }

      async function sha256(value) {
        const text = String(value ?? '');
        if (window.crypto && crypto.subtle && window.TextEncoder) {
          const buffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('personbase:' + text));
          return Array.from(new Uint8Array(buffer)).map((b) => b.toString(16).padStart(2, '0')).join('');
        }
        let hash = 2166136261 >>> 0;
        for (let i = 0; i < text.length; i++) {
          hash ^= text.charCodeAt(i);
          hash = Math.imul(hash, 16777619);
        }
        return (hash >>> 0).toString(16);
      }

      async function ensureAdminSeed() {
        if (!state.store.users[ADMIN_USER]) {
          state.store.users[ADMIN_USER] = {
            hash: await sha256(ADMIN_PASSWORD),
            perms: defaultPerms(),
            dbPerms: {}
          };
        }
        state.store.users[ADMIN_USER].perms = {
          ...defaultPerms(),
          createDb: true,
          renameDb: true,
          delDb: true,
          blocked: false
        };
        for (const db of state.store.dbs) ensureDbAccess(ADMIN_USER, db.id);
      }

      function loadLocal() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            state.store = { users: {}, dbs: [] };
            return;
          }
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.dbs)) {
            state.store = parsed;
          }
          if (parsed && parsed.theme) {
            state.theme = parsed.theme === 'dark' ? 'dark' : 'light';
          }
        } catch (error) {
          console.error('Load local error:', error);
          state.store = { users: {}, dbs: [] };
        }
      }

      function saveLocal() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state.store, theme: state.theme }));
      }

      function applyTheme() {
        document.body.setAttribute('data-theme', state.theme);
      }

      function setStatus(cls, text) {
        state.statusClass = cls;
        state.statusText = text;
        const statusEl = document.getElementById('status');
        if (statusEl) {
          statusEl.className = `status ${cls}`;
          statusEl.textContent = text;
        }
      }

      function isAdmin() { return state.currentUser === ADMIN_USER; }

      function getUserPerms(username) {
        ensureUser(username);
        return state.store.users[username].perms;
      }

      function getDbPerms(username, dbId) {
        ensureUser(username);
        ensureDbAccess(username, dbId);
        return state.store.users[username].dbPerms[dbId];
      }

      function canGlobal(action) {
        if (!state.currentUser) return false;
        if (isAdmin()) return true;
        const perms = getUserPerms(state.currentUser);
        return !perms.blocked && !!perms[action];
      }

      function canDb(action, dbId) {
        if (!state.currentUser) return false;
        if (isAdmin()) return true;
        if (!dbId) return true;
        const user = getUserPerms(state.currentUser);
        if (user.blocked) return false;
        const perms = getDbPerms(state.currentUser, dbId);
        return !!perms[action];
      }

      function currentDb() {
        if (!state.store.dbs.length) {
          state.store.dbs = [{ id: uid(), name: DEFAULT_DB_NAME, recs: [] }];
        }
        if (!state.activeDbId) state.activeDbId = state.store.dbs[0].id;
        return state.store.dbs.find((db) => db.id === state.activeDbId) || state.store.dbs[0];
      }

      function renderRows(recs) {
        const term = state.search.trim().toLowerCase();
        const rows = (recs || []).filter((rec) => {
          if (!term) return true;
          const hay = [rec.fio, rec.personalNumber, rec.phone, rec.position, rec.address, rec.notes].join(' ').toLowerCase();
          return hay.includes(term);
        });

        if (!rows.length) {
          return '<tr><td colspan="6"><div class="empty-row"><strong>Нет данных</strong>Добавьте первого человека.</div></td></tr>';
        }

        return rows.map((rec) => `
          <tr data-action="open-person" data-person-id="${rec.id}">
            <td><div class="cell-name"><span class="avatar">${escapeHtml(initials(rec.fio))}</span>${escapeHtml(rec.fio || '—')}</div></td>
            <td>${escapeHtml(rec.personalNumber || '—')}</td>
            <td>${escapeHtml(fmtDate(rec.birth))}</td>
            <td>${escapeHtml(rec.phone || '—')}</td>
            <td>${escapeHtml(rec.paymentStatus || 'Не выплачено')}</td>
            <td>${escapeHtml(rec.exclusionStatus || 'Не исключен')}</td>
          </tr>
        `).join('');
      }

      function renderAuth() {
        const reg = state.mode === 'register';
        document.getElementById('root').innerHTML = `
          <div class="root-wrap">
            <div class="auth-card">
              <div class="brand">
                <div class="brand-mark">▤</div>
                <div>PersonBase</div>
              </div>

              <div class="tab-list">
                <button class="tab-btn ${reg ? '' : 'active'}" data-action="switch-mode" data-mode="login">Вход</button>
                <button class="tab-btn ${reg ? 'active' : ''}" data-action="switch-mode" data-mode="register">Регистрация</button>
              </div>

              <div class="field">
                <label for="login-user">Логин</label>

      function collectCustomFields() {
        const map = new Map();
        document.querySelectorAll('[data-custom-type]').forEach((el) => {
          const idx = el.getAttribute('data-custom-key');
          if (!map.has(idx)) map.set(idx, {});
          const item = map.get(idx);
          item[el.getAttribute('data-custom-type')] = el.value.trim();
        });
        const result = [];
        map.forEach((item) => {
          if (item.key || item.value) result.push({ key: item.key || '', value: item.value || '' });
        });
        return result;
      }

      function collectFamilyFields() {
        const map = new Map();
        document.querySelectorAll('[data-family-field]').forEach((el) => {
          const idx = el.getAttribute('data-family-index');
          if (!map.has(idx)) map.set(idx, {});
          const item = map.get(idx);
          item[el.getAttribute('data-family-field')] = el.value.trim();
        });
        const result = [];
        map.forEach((item) => {
          if (item.name || item.relation || item.phone || item.contact || item.notes) {
            result.push({ name: item.name || '', relation: item.relation || '', phone: item.phone || '', contact: item.contact || '', notes: item.notes || '' });
          }
        });
        return result;
      }

      function savePerson() {
        const db = currentDb();
        const personId = document.querySelector('[data-action="save-person"]')?.getAttribute('data-person-id');
        let rec = (db.recs || []).find((r) => r.id === personId);
        if (!rec) {
          rec = { id: uid() };
          db.recs.push(rec);
        }

        const fio = document.getElementById('person-fio')?.value?.trim();
        if (!fio) {
          setStatus('error', 'ФИО обязательно');
          return;
        }

        rec.fio = fio;
        rec.personalNumber = document.getElementById('person-personalNumber')?.value?.trim() || '';
        rec.birth = document.getElementById('person-birth')?.value || '';
        rec.phone = document.getElementById('person-phone')?.value?.trim() || '';
        rec.email = document.getElementById('person-email')?.value?.trim() || '';
        rec.address = document.getElementById('person-address')?.value?.trim() || '';
        rec.position = document.getElementById('person-position')?.value?.trim() || '';
        rec.deathDate = document.getElementById('person-deathDate')?.value || '';
        rec.militaryCommissariat = document.getElementById('person-militaryCommissariat')?.value?.trim() || '';
        rec.relativeContact = document.getElementById('person-relativeContact')?.value?.trim() || '';
        rec.paymentStatus = document.getElementById('person-paymentStatus')?.value || 'Не выплачено';
        rec.exclusionStatus = document.getElementById('person-exclusionStatus')?.value || 'Не исключен';
        rec.ninetyEightStatus = document.getElementById('person-ninetyEightStatus')?.value || 'Нет';
        rec.familyContact = document.getElementById('person-familyContact')?.value?.trim() || '';
        rec.custom = collectCustomFields();
        rec.family = collectFamilyFields();
        rec.notes = document.getElementById('person-notes')?.value || '';

        saveLocal();
        closeModal();
        renderApp();
        setStatus('ok', 'Сохранено');
      }

      function addDb() {
        if (!canGlobal('createDb')) return;
        const name = prompt('Название новой базы:');
        if (!name || !name.trim()) return;
        const db = { id: uid(), name: name.trim(), recs: [] };
        state.store.dbs.push(db);

        saveLocal();
        renderApp();

      function renameDb() {
        const db = currentDb();
        if (!canDb('renameDb', db.id)) return;
        const next = prompt('Новое название базы:', db.name);
        if (next === null) return;
        const trimmed = next.trim();
        if (!trimmed) return;
        db.name = trimmed;
        saveLocal();
        renderApp();
      }

      function deleteDb() {
        const db = currentDb();
        if (!canDb('delDb', db.id)) return;
        if (state.store.dbs.length <= 1) {
          setStatus('error', 'Нельзя удалить последнюю базу');
          return;
        }
        if (!window.confirm(`Удалить базу "${db.name}"?`)) return;
        state.store.dbs = state.store.dbs.filter((item) => item.id !== db.id);
        state.activeDbId = state.store.dbs[0]?.id || null;
        saveLocal();
        renderApp();
        setStatus('ok', 'База удалена');
      }

      async function doAuth() {
        const username = document.getElementById('login-user')?.value.trim();
        const password = document.getElementById('login-pass')?.value || '';
        const errEl = document.getElementById('auth-error');
        const reg = state.mode === 'register';

        if (!username || !password) {
          errEl.textContent = 'Заполните логин и пароль';
          return;
        }

        if (reg) {
          const pass2 = document.getElementById('login-pass2')?.value || '';
          if (password !== pass2) {
            errEl.textContent = 'Пароли не совпадают';
            return;
          }
          if (state.store.users[username]) {
            errEl.textContent = 'Пользователь уже существует';
            return;
          }
          state.store.users[username] = {
            hash: await sha256(password),
            perms: defaultPerms(),
            dbPerms: {}
          };
          for (const db of state.store.dbs) ensureDbAccess(username, db.id);
          state.currentUser = username;
          saveLocal();
          renderApp();
          setStatus('ok', `Добро пожаловать, ${username}`);
          return;
        }

        const user = state.store.users[username];
        if (!user) {
          errEl.textContent = 'Пользователь не найден';
          return;
        }
        const hash = await sha256(password);
        if (user.hash !== hash) {
          errEl.textContent = 'Неверный пароль';
          return;
        }
        if (user.perms.blocked) {
          errEl.textContent = 'Пользователь заблокирован';
          return;
        }

        state.currentUser = username;
        errEl.textContent = '';
        renderApp();
        setStatus('ok', `Добро пожаловать, ${username}`);
      }

      function logout() {
        state.currentUser = null;
        renderAuth();
        setStatus('ok', 'Вы вышли из системы');
      }

      function resetStore() {
        if (!window.confirm('Сбросить данные приложения?')) return;
        localStorage.removeItem(STORAGE_KEY);
        state.store = { users: {}, dbs: [] };
        state.currentUser = null;
        state.activeDbId = null;
        state.mode = 'login';
        state.search = '';
        renderAuth();
        setStatus('ok', 'Данные сброшены');
      }

      function handleFileRead(file, onLoad) {
        const reader = new FileReader();
        reader.onload = (event) => onLoad(event.target.result, file);
        reader.readAsDataURL(file);
      }

      function handleUploadChange(event) {
        const pdfInput = event.target.closest('[data-role="pdf-upload"]');
        if (!pdfInput || !pdfInput.files || !pdfInput.files.length) return;
        const db = currentDb();
        const personId = document.querySelector('[data-action="save-person"]')?.getAttribute('data-person-id');
        let rec = (db.recs || []).find((r) => r.id === personId);
        if (!rec) {
          rec = { id: uid() };
          db.recs.push(rec);
        }

        rec.documents = rec.documents || [];
        Array.from(pdfInput.files).forEach((file) => {
          handleFileRead(file, (dataUrl, originalFile) => {
            rec.documents.push({
              id: uid(),
              name: originalFile.name,
              size: `${Math.round((originalFile.size || 0) / 1024)} KB`,
              dataUrl: dataUrl
            });
            saveLocal();
            closeModal();
            openPersonModal(rec.id);
          });
        });
      }

      function handleImageUpload(event) {
        const input = event.target.closest('[data-role="photo-upload"]');
        if (!input || !input.files || !input.files.length) return;
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = () => {
          const db = currentDb();
          const personId = document.querySelector('[data-action="save-person"]')?.getAttribute('data-person-id');
          let rec = (db.recs || []).find((r) => r.id === personId);
          if (!rec) {
            rec = { id: uid() };
            db.recs.push(rec);
          }
          rec.photo = reader.result;
          saveLocal();
          closeModal();
          openPersonModal(rec.id);
        };
        reader.readAsDataURL(file);
      }

      function bindRootEvents() {
        document.addEventListener('click', async (event) => {
          const el = event.target.closest('[data-action]');
          if (!el) return;
          const action = el.dataset.action;

          switch (action) {
            case 'switch-mode':
              state.mode = el.dataset.mode || 'login';
              renderAuth();
              break;
            case 'do-auth':
              await doAuth();
              break;
            case 'reset-store':
              resetStore();
              break;
            case 'logout':
              logout();
              break;
            case 'new-db':
              addDb();
              break;
            case 'select-db':
              state.activeDbId = el.dataset.dbId;
              renderApp();
              break;
            case 'new-person':
              openPersonModal();
              break;
            case 'open-person':
              openPersonModal(el.dataset.personId);
              break;
            case 'save-person':
              savePerson();
              break;
            case 'delete-person':
              deletePerson(el.dataset.personId);
              break;
            case 'rename-db':
              renameDb();
              break;
            case 'delete-db':
              deleteDb();
              break;
            case 'open-admin':
              openAdminPanel();
              break;
            case 'toggle-theme':
              state.theme = state.theme === 'dark' ? 'light' : 'dark';
              applyTheme();
              saveLocal();
              renderApp();
              break;
            case 'close-modal':
              closeModal();
              break;
            case 'add-family-row':
              addFamilyRow();
              break;
            case 'remove-family':
              el.closest('.family-box')?.remove();
              break;
            case 'add-custom-row':
              addCustomRow();
              break;
            case 'remove-custom':
              el.closest('.custom-box')?.remove();
              break;
            case 'remove-photo':
              const db2 = currentDb();
              const personId2 = document.querySelector('[data-action="save-person"]')?.getAttribute('data-person-id');
              const rec2 = (db2.recs || []).find((r) => r.id === personId2);
              if (rec2) rec2.photo = '';
              closeModal();
              openPersonModal(personId2 || rec2?.id || null);
              break;
            case 'remove-document':
              const db3 = currentDb();
              const personId3 = document.querySelector('[data-action="save-person"]')?.getAttribute('data-person-id');
              const rec3 = (db3.recs || []).find((r) => r.id === personId3);
              if (rec3 && rec3.documents) {
                rec3.documents = rec3.documents.filter((doc) => String(doc.id || '') !== String(el.dataset.docId));
                saveLocal();
                closeModal();
                openPersonModal(personId3);
              }
              break;
            case 'delete-user':
              {
                const user = el.dataset.user;
                if (!user || user === ADMIN_USER) {
                  setStatus('error', 'Нельзя удалить администратора');
                  return;
                }
                if (window.confirm(`Удалить пользователя ${user}?`)) {
                  delete state.store.users[user];
                  saveLocal();
                  closeModal();
                  renderApp();
                  setStatus('ok', 'Пользователь удалён');
                }
                break;
              }
          }
        });

        document.addEventListener('change', (event) => {
          const block = event.target.closest('[data-role="toggle-block"]');
          if (block) {
            const user = block.dataset.user;
            if (!user || user === ADMIN_USER) {
              block.checked = false;
              setStatus('error', 'Администратор не может быть заблокирован');
              return;
            }
            state.store.users[user].perms.blocked = block.checked;
            saveLocal();
            setStatus('ok', 'Статус блокировки обновлён');
            return;
          }

          const input = event.target.closest('[data-role="photo-upload"]');
          if (input) {
            handleImageUpload(event);
            return;
          }

          const pdfInput = event.target.closest('[data-role="pdf-upload"]');
          if (pdfInput) {
            handleUploadChange(event);
          }
        });

        document.addEventListener('input', (event) => {
          const searchInput = event.target.closest('#person-search');
          if (searchInput) {
            state.search = searchInput.value;
            const tbody = document.querySelector('tbody');
            if (tbody) tbody.innerHTML = renderRows(currentDb().recs || []);
          }
        });
      }

      async function init() {
        loadLocal();
        ensureDefaultData();
        await ensureAdminSeed();
        saveLocal();
        applyTheme();
        bindRootEvents();
        if (state.currentUser) {
          renderApp();
        } else {
          renderAuth();
        }
      }

      init();
    })();
  </script>
</body>
</html>
